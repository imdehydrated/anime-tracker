# Docker Compose version (this is just metadata)
# version: '3.8'

# "services" means "containers" - we define 3 containers below
services:

  # Service 1: PostgreSQL Database
  db:
    # Use official PostgreSQL 15 image from Docker Hub
    image: pgvector/pgvector:pg15

    # Container name (easier to reference than auto-generated names)
    container_name: animetracker-db

    # Restart policy: always restart if it crashes
    restart: unless-stopped

    # Environment variables (configuration passed to the container)
    environment:
      # Database name to create on startup
      POSTGRES_DB: animetracker
      # Superuser username
      POSTGRES_USER: anime_user
      # Superuser password (IMPORTANT: Use strong passwords in production!)
      POSTGRES_PASSWORD: anime_pass123

    # Port mapping: host:container
    # 5432 on your computer maps to 5432 inside the container
    ports:
      - "5432:5432"

    # Volumes: Persist data even when container stops
    # This maps a folder on your computer to the container's data folder
    volumes:
      - postgres-data:/var/lib/postgresql/data

    # Health check: Docker runs this command to verify the DB is ready
    healthcheck:
      # "pg_isready" is a PostgreSQL command that checks if DB accepts connections
      test: ["CMD-SHELL", "pg_isready -U anime_user -d animetracker"]
      interval: 10s        # Check every 10 seconds
      timeout: 5s          # Wait 5 seconds for response
      retries: 5           # Try 5 times before marking as unhealthy

    # Networks: Connect this container to our custom network
    networks:
      - animetracker-network

  # Service 2: Spring Boot Backend
  backend:
    # Build from Dockerfile in ./backend directory
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - .env
    container_name: animetracker-backend
    restart: unless-stopped
    volumes:
      - ./ml-models:/app/models:ro

    # Environment variables for Spring Boot
    environment:
      # Server port
      SERVER_PORT: 8080
      # OpenAI API key for semantic recommendations
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # JDBC URL: How to connect to the database
      # "db" is the service name above - Docker's DNS resolves it
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/animetracker
      SPRING_DATASOURCE_USERNAME: anime_user
      SPRING_DATASOURCE_PASSWORD: anime_pass123

      # JPA/Hibernate settings
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate  # Don't auto-create tables (Flyway handles it)
      SPRING_JPA_SHOW_SQL: "true"              # Log SQL queries (helpful for learning!)

    # Port mapping: access backend at localhost:8080
    ports:
      - "8080:8080"

    # depends_on: Start backend only after db is healthy
    depends_on:
      db:
        condition: service_healthy

    networks:
      - animetracker-network

  # Service 3: React Frontend
  frontend:
    # Build from Dockerfile in ./frontend directory
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: animetracker-frontend
    restart: unless-stopped

    # Environment variables
    environment:
      # React uses REACT_APP_ prefix for env vars
      REACT_APP_API_URL: http://backend:8080
      # Enable polling for file changes (needed on Windows with Docker volumes)
      WATCHPACK_POLLING: "true"

    # Port mapping: access frontend at localhost:3000
    ports:
      - "3000:3000"

    # Start frontend after backend is running
    depends_on:
      - backend

    networks:
      - animetracker-network

    # Mount source code so React hot-reloads on file save (no rebuild needed)
    volumes:
      - ./frontend/src:/app/src

  # Service 4: ML Sidecar (FastAPI — semantic + CF models)
  ml-sidecar:
    build:
      context: ./ml-sidecar
      dockerfile: Dockerfile

    container_name: animetracker-ml-sidecar
    restart: unless-stopped

    # Port mapping: access sidecar at localhost:5000
    ports:
      - "5000:5000"

    # Mount trained model checkpoints (exported from notebooks)
    volumes:
      - ./ml-models:/app/models

    networks:
      - animetracker-network

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Volumes: Named volumes that persist data
volumes:
  # This stores PostgreSQL data on your computer
  # Even if you stop containers, data remains
  postgres-data:

# Networks: Custom network for our containers to communicate
networks:
  animetracker-network:
    driver: bridge  # Bridge network allows containers to talk to each other
