name: Deploy API (Backend + ML Sidecar)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ml-sidecar/**"
      - "infra/ecs/taskdef.api.json"

concurrency:
  group: deploy-api-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
      checks: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE_API: ${{ vars.ECS_SERVICE_API }}
      ECR_BACKEND_REPO: ${{ vars.ECR_BACKEND_REPO }}
      ECR_SIDECAR_REPO: ${{ vars.ECR_SIDECAR_REPO }}
      API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
      MODEL_BUCKET: ${{ vars.MODEL_BUCKET }}
      MODEL_KEY: ${{ vars.MODEL_KEY }}
      ECS_EXECUTION_ROLE_NAME: ${{ vars.ECS_EXECUTION_ROLE_NAME }}
      ECS_TASK_ROLE_NAME: ${{ vars.ECS_TASK_ROLE_NAME }}
      RDS_HOST: ${{ secrets.RDS_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine sidecar rebuild requirement
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "SIDECAR_REBUILD_REQUIRED=true" >> "$GITHUB_ENV"
            echo "Manual run: sidecar rebuild enabled."
            exit 0
          fi

          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "SIDECAR_REBUILD_REQUIRED=true" >> "$GITHUB_ENV"
            echo "No valid base SHA found: sidecar rebuild enabled."
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" || true)"
          if echo "${CHANGED_FILES}" | grep -qE '^ml-sidecar/'; then
            echo "SIDECAR_REBUILD_REQUIRED=true" >> "$GITHUB_ENV"
            echo "Detected ml-sidecar changes: sidecar rebuild enabled."
          else
            echo "SIDECAR_REBUILD_REQUIRED=false" >> "$GITHUB_ENV"
            echo "No ml-sidecar changes detected: sidecar rebuild skipped."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Backend compile
        run: mvn -q -DskipTests compile -f backend/pom.xml

      - name: Backend targeted tests
        env:
          JWT_SECRET: test-secret
        run: mvn -q "-Dtest=RecommendationControllerTest,SemanticRecommendationServiceTest,AnimeSearchControllerTest,AniListServiceTest,RequestRateLimitingFilterTest" test -f backend/pom.xml

      - name: Wait for security scan to pass
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          REPO="${GITHUB_REPOSITORY}"
          POLL_SECONDS=60
          MAX_ATTEMPTS=15
          echo "Waiting for Security Scan check on commit ${SHA}..."

          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            response=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/commits/${SHA}/check-runs")

            status=$(echo "${response}" | jq -r '[.check_runs[] | select(.name=="container-scan")] | sort_by(.started_at) | last | .status // ""')
            conclusion=$(echo "${response}" | jq -r '[.check_runs[] | select(.name=="container-scan")] | sort_by(.started_at) | last | .conclusion // ""')

            if [ -z "${status}" ]; then
              echo "Security scan check not created yet (attempt ${attempt}/${MAX_ATTEMPTS})."
              sleep "${POLL_SECONDS}"
              continue
            fi

            if [ "${status}" != "completed" ]; then
              echo "Security scan is ${status} (attempt ${attempt}/${MAX_ATTEMPTS})."
              sleep "${POLL_SECONDS}"
              continue
            fi

            if [ "${conclusion}" = "success" ]; then
              echo "Security scan passed."
              exit 0
            fi

            echo "Security scan concluded with '${conclusion}'. Failing deploy."
            exit 1
          done

          echo "Timed out waiting for security scan result."
          exit 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate required CI variables
        run: |
          set -euo pipefail
          required_vars=(
            "AWS_REGION"
            "ECS_CLUSTER"
            "ECS_SERVICE_API"
            "ECR_BACKEND_REPO"
            "ECR_SIDECAR_REPO"
            "API_HEALTH_URL"
            "ECS_EXECUTION_ROLE_NAME"
            "ECS_TASK_ROLE_NAME"
            "RDS_HOST"
          )
          if [ "${SIDECAR_REBUILD_REQUIRED:-false}" = "true" ]; then
            required_vars+=("MODEL_BUCKET" "MODEL_KEY")
          fi
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "Missing required variable: ${var_name}"
              exit 1
            fi
          done

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mask registry output
        run: |
          echo "::add-mask::${{ steps.login-ecr.outputs.registry }}"

      - name: Build and push backend image
        id: build-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          pull: true
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}
          no-cache-filters: runtime
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,scope=backend-prod,mode=max

      - name: Export backend image ref
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          echo "BACKEND_IMAGE=${ECR_REGISTRY}/${ECR_BACKEND_REPO}:${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build and push ml-sidecar image
        if: env.SIDECAR_REBUILD_REQUIRED == 'true'
        id: build-sidecar
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          aws s3 cp "s3://${MODEL_BUCKET}/${MODEL_KEY}" ml-models.tar.gz
          tar -xzf ml-models.tar.gz
          test -f ml-models/cf/model.pt
          test -f ml-models/semantic/model.safetensors

      - name: Build and push ml-sidecar image
        if: env.SIDECAR_REBUILD_REQUIRED == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ml-sidecar/Dockerfile.prod
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_SIDECAR_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=sidecar-prod
          cache-to: type=gha,scope=sidecar-prod,mode=max

      - name: Export sidecar image ref
        if: env.SIDECAR_REBUILD_REQUIRED == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          echo "SIDECAR_IMAGE=${ECR_REGISTRY}/${ECR_SIDECAR_REPO}:${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Reuse currently deployed sidecar image (skip rebuild path)
        if: env.SIDECAR_REBUILD_REQUIRED != 'true'
        run: |
          set -euo pipefail
          CURRENT_TASKDEF_ARN=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE_API}" --query "services[0].taskDefinition" --output text)
          CURRENT_SIDECAR_IMAGE=$(aws ecs describe-task-definition --task-definition "${CURRENT_TASKDEF_ARN}" --query "taskDefinition.containerDefinitions[?name=='ml-sidecar'].image | [0]" --output text)
          if [ -z "${CURRENT_SIDECAR_IMAGE}" ] || [ "${CURRENT_SIDECAR_IMAGE}" = "None" ]; then
            echo "Could not resolve currently deployed ml-sidecar image."
            exit 1
          fi
          echo "SIDECAR_IMAGE=${CURRENT_SIDECAR_IMAGE}" >> "$GITHUB_ENV"
          echo "Reusing deployed sidecar image: ${CURRENT_SIDECAR_IMAGE}"

      - name: Prepare API task definition from template
        run: |
          set -euo pipefail
          cp infra/ecs/taskdef.api.json taskdef-api.json
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          EXEC_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${ECS_EXECUTION_ROLE_NAME}"
          TASK_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${ECS_TASK_ROLE_NAME}"
          jq --arg exec_role "${EXEC_ROLE_ARN}" --arg task_role "${TASK_ROLE_ARN}" \
            '.executionRoleArn=$exec_role | .taskRoleArn=$task_role' \
            taskdef-api.json > taskdef-api.next.json
          mv taskdef-api.next.json taskdef-api.json

          jq --arg rds_host "${RDS_HOST}" \
            '(.containerDefinitions[] | select(.name=="backend").environment[] | select(.name=="SPRING_DATASOURCE_URL").value) |= sub("REPLACE_WITH_RDS_HOST"; $rds_host)' \
            taskdef-api.json > taskdef-api.next.json
          mv taskdef-api.next.json taskdef-api.json

          mapfile -t secret_refs < <(jq -r '.containerDefinitions[]?.secrets[]?.valueFrom // empty' taskdef-api.json | sort -u)
          for ref in "${secret_refs[@]}"; do
            if [[ "${ref}" == arn:* ]]; then
              continue
            fi
            secret_arn=$(aws secretsmanager describe-secret --secret-id "${ref}" --query "ARN" --output text)
            jq --arg ref "${ref}" --arg arn "${secret_arn}" \
              '(.containerDefinitions[]?.secrets[]? | select(.valueFrom==$ref) | .valueFrom) = $arn' \
              taskdef-api.json > taskdef-api.next.json
            mv taskdef-api.next.json taskdef-api.json
          done

          if jq -e 'any(.containerDefinitions[]?; any(.secrets[]?; (.valueFrom | startswith("arn:") | not)))' taskdef-api.json >/dev/null; then
            echo "Unresolved secret references remain in taskdef-api.json"
            exit 1
          fi
          if jq -e '.. | strings | select(test("REPLACE_WITH_RDS_HOST"))' taskdef-api.json >/dev/null; then
            echo "RDS host placeholder was not resolved in taskdef-api.json"
            exit 1
          fi

      - name: Render task definition (backend)
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef-api.json
          container-name: backend
          image: ${{ env.BACKEND_IMAGE }}

      - name: Render task definition (ml-sidecar)
        id: render-sidecar
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          container-name: ml-sidecar
          image: ${{ env.SIDECAR_IMAGE }}

      - name: Deploy API service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-sidecar.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_API }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test API
        run: |
          set -euo pipefail
          curl -f "${API_HEALTH_URL}/api/health"

      - name: Capture deployed task definition
        id: deployed-taskdef
        run: |
          set -euo pipefail
          TASKDEF_ARN=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE_API}" --query "services[0].taskDefinition" --output text)
          echo "taskdef_arn=${TASKDEF_ARN}" >> "$GITHUB_OUTPUT"
          echo "Deployed task definition: ${TASKDEF_ARN}"

      - name: Rollback command (reference)
        run: |
          echo "Rollback command:"
          echo "aws ecs update-service --cluster ${ECS_CLUSTER} --service ${ECS_SERVICE_API} --task-definition <PREVIOUS_TASKDEF_ARN>"
