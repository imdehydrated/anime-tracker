name: Deploy Web (Frontend Container)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-web.yml"

concurrency:
  group: deploy-web-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE_WEB: ${{ vars.ECS_SERVICE_WEB }}
      ECR_FRONTEND_REPO: ${{ vars.ECR_FRONTEND_REPO }}
      WEB_HEALTH_URL: ${{ vars.WEB_HEALTH_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate required CI variables
        run: |
          set -euo pipefail
          required_vars=(
            "AWS_REGION"
            "ECS_CLUSTER"
            "ECS_SERVICE_WEB"
            "ECR_FRONTEND_REPO"
            "WEB_HEALTH_URL"
          )
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "Missing required variable: ${var_name}"
              exit 1
            fi
          done

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Mask registry output
        run: |
          echo "::add-mask::${{ steps.login-ecr.outputs.registry }}"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_TAG=${GITHUB_SHA}
          docker build -f frontend/Dockerfile.prod -t ${ECR_REGISTRY}/${ECR_FRONTEND_REPO}:${IMAGE_TAG} .
          docker push ${ECR_REGISTRY}/${ECR_FRONTEND_REPO}:${IMAGE_TAG}
          echo "FRONTEND_IMAGE=${ECR_REGISTRY}/${ECR_FRONTEND_REPO}:${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Export current web task definition
        run: |
          set -euo pipefail
          SERVICE_TASKDEF_ARN=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE_WEB}" --query "services[0].taskDefinition" --output text)
          aws ecs describe-task-definition --task-definition "${SERVICE_TASKDEF_ARN}" --query "taskDefinition" --output json > taskdef-web.base.json
          jq 'del(
            .taskDefinitionArn,
            .requiresAttributes,
            .compatibilities,
            .revision,
            .status,
            .registeredAt,
            .registeredBy,
            .deregisteredAt
          )' taskdef-web.base.json > taskdef-web.json

      - name: Render task definition (frontend)
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef-web.json
          container-name: frontend
          image: ${{ env.FRONTEND_IMAGE }}

      - name: Deploy web service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_WEB }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test web
        run: |
          set -euo pipefail
          curl -f "${WEB_HEALTH_URL}/"

      - name: Capture deployed task definition
        id: deployed-taskdef
        run: |
          set -euo pipefail
          TASKDEF_ARN=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE_WEB}" --query "services[0].taskDefinition" --output text)
          echo "taskdef_arn=${TASKDEF_ARN}" >> "$GITHUB_OUTPUT"
          echo "Deployed task definition: ${TASKDEF_ARN}"

      - name: Rollback command (reference)
        run: |
          echo "Rollback command:"
          echo "aws ecs update-service --cluster ${ECS_CLUSTER} --service ${ECS_SERVICE_WEB} --task-definition <PREVIOUS_TASKDEF_ARN>"
