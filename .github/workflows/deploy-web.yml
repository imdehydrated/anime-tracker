name: Deploy Web (Frontend Container)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "infra/ecs/taskdef.web.json"
      - ".github/workflows/deploy-web.yml"

concurrency:
  group: deploy-web-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
      checks: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE_WEB: ${{ vars.ECS_SERVICE_WEB }}
      ECR_FRONTEND_REPO: ${{ vars.ECR_FRONTEND_REPO }}
      WEB_HEALTH_URL: ${{ vars.WEB_HEALTH_URL }}
      ECS_EXECUTION_ROLE_NAME: ${{ vars.ECS_EXECUTION_ROLE_NAME }}
      ECS_TASK_ROLE_NAME: ${{ vars.ECS_TASK_ROLE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for security scan to pass
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          REPO="${GITHUB_REPOSITORY}"
          POLL_SECONDS=60
          MAX_ATTEMPTS=15
          echo "Waiting for Security Scan check on commit ${SHA}..."

          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            response=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/commits/${SHA}/check-runs")

            status=$(echo "${response}" | jq -r '[.check_runs[] | select(.name=="container-scan")] | sort_by(.started_at) | last | .status // ""')
            conclusion=$(echo "${response}" | jq -r '[.check_runs[] | select(.name=="container-scan")] | sort_by(.started_at) | last | .conclusion // ""')

            if [ -z "${status}" ]; then
              echo "Security scan check not created yet (attempt ${attempt}/${MAX_ATTEMPTS})."
              sleep "${POLL_SECONDS}"
              continue
            fi

            if [ "${status}" != "completed" ]; then
              echo "Security scan is ${status} (attempt ${attempt}/${MAX_ATTEMPTS})."
              sleep "${POLL_SECONDS}"
              continue
            fi

            if [ "${conclusion}" = "success" ]; then
              echo "Security scan passed."
              exit 0
            fi

            echo "Security scan concluded with '${conclusion}'. Failing deploy."
            exit 1
          done

          echo "Timed out waiting for security scan result."
          exit 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate required CI variables
        run: |
          set -euo pipefail
          required_vars=(
            "AWS_REGION"
            "ECS_CLUSTER"
            "ECS_SERVICE_WEB"
            "ECR_FRONTEND_REPO"
            "WEB_HEALTH_URL"
            "ECS_EXECUTION_ROLE_NAME"
            "ECS_TASK_ROLE_NAME"
          )
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "Missing required variable: ${var_name}"
              exit 1
            fi
          done

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mask registry output
        run: |
          echo "::add-mask::${{ steps.login-ecr.outputs.registry }}"

      - name: Build and push frontend image
        id: build-frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile.prod
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,scope=frontend-prod,mode=max

      - name: Export frontend image ref
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          echo "FRONTEND_IMAGE=${ECR_REGISTRY}/${ECR_FRONTEND_REPO}:${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Prepare web task definition from template
        run: |
          set -euo pipefail
          cp infra/ecs/taskdef.web.json taskdef-web.json
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          EXEC_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${ECS_EXECUTION_ROLE_NAME}"
          TASK_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${ECS_TASK_ROLE_NAME}"
          jq --arg exec_role "${EXEC_ROLE_ARN}" --arg task_role "${TASK_ROLE_ARN}" \
            '.executionRoleArn=$exec_role | .taskRoleArn=$task_role' \
            taskdef-web.json > taskdef-web.next.json
          mv taskdef-web.next.json taskdef-web.json

      - name: Render task definition (frontend)
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef-web.json
          container-name: frontend
          image: ${{ env.FRONTEND_IMAGE }}

      - name: Deploy web service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_WEB }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test web
        run: |
          set -euo pipefail
          curl -f "${WEB_HEALTH_URL}/"

      - name: Capture deployed task definition
        id: deployed-taskdef
        run: |
          set -euo pipefail
          TASKDEF_ARN=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE_WEB}" --query "services[0].taskDefinition" --output text)
          echo "taskdef_arn=${TASKDEF_ARN}" >> "$GITHUB_OUTPUT"
          echo "Deployed task definition: ${TASKDEF_ARN}"

      - name: Rollback command (reference)
        run: |
          echo "Rollback command:"
          echo "aws ecs update-service --cluster ${ECS_CLUSTER} --service ${ECS_SERVICE_WEB} --task-definition <PREVIOUS_TASKDEF_ARN>"
