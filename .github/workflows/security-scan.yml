name: Security Scan

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "ml-sidecar/**"
      - "infra/ecs/taskdef.api.json"
      - "infra/ecs/taskdef.web.json"
      - ".github/workflows/deploy-api.yml"
      - ".github/workflows/deploy-web.yml"

jobs:
  container-scan:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      MODEL_BUCKET: ${{ vars.MODEL_BUCKET }}
      MODEL_KEY: ${{ vars.MODEL_KEY }}
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: security-scan-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t animetracker-backend:scan backend

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile.prod -t animetracker-frontend:scan .

      - name: Configure AWS credentials (OIDC)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download model artifacts
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${MODEL_BUCKET:-}" ] || [ -z "${MODEL_KEY:-}" ]; then
            echo "MODEL_BUCKET and MODEL_KEY must be set for sidecar scan."
            exit 1
          fi
          aws s3 cp "s3://${MODEL_BUCKET}/${MODEL_KEY}" ml-models.tar.gz
          tar -xzf ml-models.tar.gz
          test -f ml-models/cf/model.pt
          test -f ml-models/semantic/model.safetensors

      - name: Build sidecar image
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: docker build -f ml-sidecar/Dockerfile.prod -t animetracker-sidecar:scan .

      - name: Trivy scan backend
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.60.0 image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 animetracker-backend:scan

      - name: Trivy scan frontend
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.60.0 image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 animetracker-frontend:scan

      - name: Trivy scan sidecar
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.60.0 image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 animetracker-sidecar:scan
