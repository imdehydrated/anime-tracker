<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character encoding: UTF-8 supports all languages -->
    <meta charset="utf-8" />

    <!-- Responsive design: Scale properly on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme color: Browser UI color on mobile (Android) -->
    <meta name="theme-color" content="#000000" />

    <!-- SEO: Description shown in search results -->
    <meta
      name="description"
      content="AniRec - Track your anime and get personalized recommendations"
    />

    <!-- Page title (shown in browser tab) -->
    <title>Anime Tracker</title>
  </head>
  <body>
    <!-- noscript: Message shown if JavaScript is disabled -->
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Root div: React mounts here -->
    <!-- React will replace this div's content with your app -->
    <div id="root"></div>

    <!--
      React Scripts automatically injects:
      - JavaScript bundle (your compiled React code)
      - CSS files
      - Other assets

      You don't need to add <script> tags manually!
    -->
  </body>
</html>
