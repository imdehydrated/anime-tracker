# Spring Boot Configuration File
# YAML format: Key-value pairs with indentation (like Python)

# Spring Framework configuration
spring:

  # Application name (appears in logs and metrics)
  application:
    name: anime-tracker-backend

  # Database connection (DataSource)
  datasource:
    # JDBC URL: How to connect to the database
    # ${VARIABLE} pulls from environment variables (set in docker-compose.yml)
    # If env var is missing, use default after ":"
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/animetracker}

    # Database username
    username: ${SPRING_DATASOURCE_USERNAME:anime_user}

    # Database password (NEVER hardcode passwords! Use env vars.)
    password: ${SPRING_DATASOURCE_PASSWORD:anime_pass123}

    # Driver class (PostgreSQL JDBC driver)
    # Spring Boot auto-detects this, but explicit is better
    driver-class-name: org.postgresql.Driver
    hikari:
      # Concurrency-safe defaults for Fargate + RDS Proxy deployments.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MIN_IDLE:5}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT_MS:2000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME_MS:30000}

  # JPA (Java Persistence API) configuration
  jpa:
    # Hibernate DDL (Data Definition Language) mode
    # Options: create, create-drop, update, validate, none
    # - create: Drop tables and recreate on startup (DANGEROUS! Deletes data)
    # - update: Update schema automatically (not recommended for production)
    # - validate: Only check that entities match the database (our choice)
    # - none: Do nothing
    # We use "validate" because Flyway manages schema changes
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

    # Show SQL queries in logs (helpful for learning and debugging)
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

    # Format SQL queries (pretty print)
    properties:
      hibernate:
        format_sql: true
        # Dialect: Tell Hibernate we're using PostgreSQL
        # This affects how SQL queries are generated
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway configuration (database migrations)
  flyway:
    # Enable Flyway
    enabled: true

    # Location of migration scripts
    # Spring Boot automatically looks in src/main/resources/db/migration/
    locations: classpath:db/migration

    # Baseline version (starting point)
    baseline-on-migrate: true
    baseline-version: 0

    # Validate migrations on startup
    validate-on-migrate: true

# Server configuration (embedded Tomcat)
server:
  # Port number (default is 8080)
  port: ${SERVER_PORT:8080}

  # Error handling: Include error details in responses (for debugging)
  # Defaults are hardened for production.
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}
    include-stacktrace: ${SERVER_ERROR_INCLUDE_STACKTRACE:never}

# Logging configuration
logging:
  level:
    # Root logger (default for everything)
    root: INFO

    # Our application's logs (more detailed)
    com.animetracker: INFO

    # Spring Framework logs (less verbose)
    org.springframework: INFO
  
# JWT Configuration
jwt:
  secret: ${JWT_SECRET}

# ML Sidecar Configuration (custom semantic + CF models)
ml-sidecar:
  base-url: ${ML_SIDECAR_URL:http://ml-sidecar:5000}
  # Sidecar is a required dependency for semantic/similar/cf recommendation paths.
  enabled: ${ML_SIDECAR_ENABLED:true}
  startup-healthcheck-enabled: ${ML_SIDECAR_STARTUP_HEALTHCHECK_ENABLED:true}
  startup-healthcheck-attempts: ${ML_SIDECAR_STARTUP_HEALTHCHECK_ATTEMPTS:6}
  startup-healthcheck-delay-ms: ${ML_SIDECAR_STARTUP_HEALTHCHECK_DELAY_MS:2000}
  timeout-ms: 30000

# AniList API pacing to avoid upstream rate limits during interactive usage.
anilist:
  request-spacing-ms: ${ANILIST_REQUEST_SPACING_MS:700}
  # Max per-search local metadata hydrations for incomplete rows.
  # Runtime recommendation/search paths are local-DB only; no AniList HTTP fallback.
  search-metadata-hydration-max: ${ANILIST_SEARCH_METADATA_HYDRATION_MAX:2}

# Recommendation vector retrieval configuration
recommendations:
  security:
    rate-limit:
      enabled: ${RECOMMENDATIONS_SECURITY_RATE_LIMIT_ENABLED:true}
      window-seconds: ${RECOMMENDATIONS_SECURITY_RATE_LIMIT_WINDOW_SECONDS:300}
      cleanup-interval-seconds: ${RECOMMENDATIONS_SECURITY_RATE_LIMIT_CLEANUP_INTERVAL_SECONDS:60}
      # Balanced launch profile.
      anonymous-global-limit: ${RECOMMENDATIONS_SECURITY_RATE_LIMIT_ANON_GLOBAL_LIMIT:1200}
      authenticated-global-limit: ${RECOMMENDATIONS_SECURITY_RATE_LIMIT_AUTH_GLOBAL_LIMIT:1800}
      search-limit: ${RECOMMENDATIONS_SECURITY_RATE_LIMIT_SEARCH_LIMIT:600}
      recommendation-limit: ${RECOMMENDATIONS_SECURITY_RATE_LIMIT_RECOMMENDATION_LIMIT:300}
      login-limit: ${RECOMMENDATIONS_SECURITY_RATE_LIMIT_LOGIN_LIMIT:60}
      register-limit: ${RECOMMENDATIONS_SECURITY_RATE_LIMIT_REGISTER_LIMIT:20}
      # When true, the limiter parses X-Forwarded-For and uses a proxy-safe hop strategy
      # (penultimate when multiple hops) before falling back to remote address.
      trust-forwarded-for: ${RECOMMENDATIONS_SECURITY_RATE_LIMIT_TRUST_FORWARDED_FOR:true}
  ops:
    # Manual maintenance endpoints (/custom-embeddings/import|populate|failures) are disabled by default.
    # Enable only for controlled ops sessions.
    manual-endpoints-enabled: ${RECOMMENDATIONS_OPS_MANUAL_ENDPOINTS_ENABLED:false}
    # Optional second-factor token required in X-Ops-Token header for manual maintenance endpoints.
    token: ${RECOMMENDATIONS_OPS_TOKEN}
  list-import:
    mal:
      # Official MAL API credentials for username import endpoint (/api/users/list/import/mal).
      # MAL v2 username list reads require client-id; secret is optional for future OAuth flows.
      client-id: ${RECOMMENDATIONS_MAL_CLIENT_ID:${MAL_CLIENT_ID:}}
      client-secret: ${RECOMMENDATIONS_MAL_CLIENT_SECRET:${MAL_CLIENT_SECRET:}}
  # OpenAI embedding fallback is removed; custom vectors should remain enabled.
  # true: query embedding_custom (384-dim)
  use-custom-vectors: ${RECOMMENDATIONS_USE_CUSTOM_VECTORS:true}
  # Default list influence for Smart Search semantic mode when request listWeight is omitted.
  default-list-weight: ${RECOMMENDATIONS_DEFAULT_LIST_WEIGHT:0.20}
  # Default list influence for Similar mode when request listWeight is omitted.
  default-similar-list-weight: ${RECOMMENDATIONS_DEFAULT_SIMILAR_LIST_WEIGHT:0.00}
  # Feedback-to-taste contribution weights for logged-in personalization.
  feedback:
    taste-thumbs-up-weight: ${RECOMMENDATIONS_FEEDBACK_TASTE_THUMBS_UP_WEIGHT:1.50}
    taste-thumbs-down-weight: ${RECOMMENDATIONS_FEEDBACK_TASTE_THUMBS_DOWN_WEIGHT:1.00}
    taste-rating-weight: ${RECOMMENDATIONS_FEEDBACK_TASTE_RATING_WEIGHT:0.70}
    score-adjustment-thumbs-up: ${RECOMMENDATIONS_FEEDBACK_SCORE_ADJUSTMENT_THUMBS_UP:0.04}
    score-adjustment-thumbs-down: ${RECOMMENDATIONS_FEEDBACK_SCORE_ADJUSTMENT_THUMBS_DOWN:0.06}
  cf:
    # Blend CF sidecar score with user taste-vector cosine similarity.
    taste-vector-weight: ${RECOMMENDATIONS_CF_TASTE_VECTOR_WEIGHT:0.20}
    # Cold-start fallback: use popularity-ranked local catalog results when user history is too small
    # or sidecar CF returns no candidates.
    popular-fallback-enabled: ${RECOMMENDATIONS_CF_POPULAR_FALLBACK_ENABLED:true}
    popular-fallback-min-rated-items: ${RECOMMENDATIONS_CF_POPULAR_FALLBACK_MIN_RATED_ITEMS:3}
    popular-fallback-candidate-limit: ${RECOMMENDATIONS_CF_POPULAR_FALLBACK_CANDIDATE_LIMIT:100}
  # Used by POST /api/users/recommendations/custom-embeddings/import when path is omitted
  custom-embeddings-path: ${CUSTOM_EMBEDDINGS_PATH:/app/models/anime_embeddings.jsonl}
  # On startup, import custom embeddings only if source JSONL changed since last import.
  auto-sync-custom-embeddings: ${AUTO_SYNC_CUSTOM_EMBEDDINGS:true}
  # Cache size for local metadata hydration fallback (AniList responses stored in-memory).
  metadata-hydration-cache-size: ${RECOMMENDATIONS_METADATA_HYDRATION_CACHE_SIZE:5000}
  # Global recommendation control tuning knobs.
  filters:
    popularity-attenuation-low: ${RECOMMENDATIONS_POPULARITY_ATTENUATION_LOW:0.00}
    popularity-attenuation-medium: ${RECOMMENDATIONS_POPULARITY_ATTENUATION_MEDIUM:0.08}
    popularity-attenuation-high: ${RECOMMENDATIONS_POPULARITY_ATTENUATION_HIGH:0.16}
    # Separate CF attenuation curve so CF can stay less popularity-biased than semantic/similar.
    cf-popularity-attenuation-low: ${RECOMMENDATIONS_CF_POPULARITY_ATTENUATION_LOW:0.00}
    cf-popularity-attenuation-medium: ${RECOMMENDATIONS_CF_POPULARITY_ATTENUATION_MEDIUM:0.05}
    cf-popularity-attenuation-high: ${RECOMMENDATIONS_CF_POPULARITY_ATTENUATION_HIGH:0.10}
    # Keep small candidate pools from collapsing after strict control filters.
    underfill-min-ratio: ${RECOMMENDATIONS_FILTERS_UNDERFILL_MIN_RATIO:0.60}
    underfill-min-floor: ${RECOMMENDATIONS_FILTERS_UNDERFILL_MIN_FLOOR:5}
    # Base AniList metadata hydration floor per response for relation/format-aware filtering.
    # Runtime may adapt this upward based on candidate count and active strict filters.
    entrypoint-remap-max-hydrations: ${RECOMMENDATIONS_FILTERS_ENTRYPOINT_REMAP_MAX_HYDRATIONS:8}
    # Hard cap for adaptive relation/format hydration in recommendation filtering.
    entrypoint-remap-max-hydrations-hard-cap: ${RECOMMENDATIONS_FILTERS_ENTRYPOINT_REMAP_MAX_HYDRATIONS_HARD_CAP:12}
    # Separate hydration budget for CF mode to avoid AniList rate-limit spikes under frequent For You requests.
    entrypoint-remap-max-hydrations-cf: ${RECOMMENDATIONS_FILTERS_ENTRYPOINT_REMAP_MAX_HYDRATIONS_CF:3}
    # Per-request failure threshold before hydration circuit opens and skips further AniList relation calls.
    entrypoint-remap-failure-circuit-threshold: ${RECOMMENDATIONS_FILTERS_ENTRYPOINT_REMAP_FAILURE_CIRCUIT_THRESHOLD:3}
  semantic:
    # Hybrid candidate generation for Smart Search: vector retrieval + lexical matches.
    lexical-enabled: ${RECOMMENDATIONS_SEMANTIC_LEXICAL_ENABLED:true}
    lexical-candidate-limit: ${RECOMMENDATIONS_SEMANTIC_LEXICAL_CANDIDATE_LIMIT:60}
    vector-candidate-limit: ${RECOMMENDATIONS_SEMANTIC_VECTOR_CANDIDATE_LIMIT:140}
    merged-candidate-limit: ${RECOMMENDATIONS_SEMANTIC_MERGED_CANDIDATE_LIMIT:140}
    similar-candidate-limit: ${RECOMMENDATIONS_SEMANTIC_SIMILAR_CANDIDATE_LIMIT:90}
    # Max query tokens retained for lexical query text construction.
    lexical-max-patterns: ${RECOMMENDATIONS_SEMANTIC_LEXICAL_MAX_PATTERNS:3}
    # Residual lexical boost retained for compatibility after retrieval fusion.
    lexical-boost: ${RECOMMENDATIONS_SEMANTIC_LEXICAL_BOOST:0.08}
    # Reciprocal rank fusion controls for vector + lexical candidate merging.
    lexical-rrf-k: ${RECOMMENDATIONS_SEMANTIC_LEXICAL_RRF_K:60}
    lexical-vector-weight: ${RECOMMENDATIONS_SEMANTIC_LEXICAL_VECTOR_WEIGHT:1.00}
    lexical-weight: ${RECOMMENDATIONS_SEMANTIC_LEXICAL_WEIGHT:0.90}
    title-intent-lexical-boost: ${RECOMMENDATIONS_SEMANTIC_TITLE_INTENT_LEXICAL_BOOST:1.20}
    # Optional sidecar reranking for semantic mode (custom vectors only).
    rerank-enabled: ${RECOMMENDATIONS_SEMANTIC_RERANK_ENABLED:true}
    rerank-top-k: ${RECOMMENDATIONS_SEMANTIC_RERANK_TOP_K:60}
    # Semantic top-result quality controls to reduce same-franchise specials/recaps.
    dedupe-enabled: ${RECOMMENDATIONS_SEMANTIC_DEDUPE_ENABLED:true}
    dedupe-max-per-franchise: ${RECOMMENDATIONS_SEMANTIC_DEDUPE_MAX_PER_FRANCHISE:1}
    dedupe-suppress-specials: ${RECOMMENDATIONS_SEMANTIC_DEDUPE_SUPPRESS_SPECIALS:true}
    # Per-query calibration to reduce overconfident semantic scores.
    score-calibration-enabled: ${RECOMMENDATIONS_SEMANTIC_SCORE_CALIBRATION_ENABLED:true}
    score-calibration-temperature: ${RECOMMENDATIONS_SEMANTIC_SCORE_CALIBRATION_TEMPERATURE:1.00}
    # Popularity prior blends AniList quality score and AniList popularity when available.
    popularity-prior-enabled: ${RECOMMENDATIONS_SEMANTIC_POPULARITY_PRIOR_ENABLED:true}
    taste-weight-logged-in: ${RECOMMENDATIONS_SEMANTIC_TASTE_WEIGHT_LOGGED_IN:0.15}
    taste-weight-logged-in-broad-query: ${RECOMMENDATIONS_SEMANTIC_TASTE_WEIGHT_LOGGED_IN_BROAD_QUERY:0.18}
    popularity-prior-weight-logged-in: ${RECOMMENDATIONS_SEMANTIC_POPULARITY_PRIOR_WEIGHT_LOGGED_IN:${RECOMMENDATIONS_SEMANTIC_POPULARITY_PRIOR_WEIGHT:0.10}}
    popularity-prior-weight-logged-in-broad-query: ${RECOMMENDATIONS_SEMANTIC_POPULARITY_PRIOR_WEIGHT_LOGGED_IN_BROAD_QUERY:0.15}
    popularity-prior-weight-logged-out: ${RECOMMENDATIONS_SEMANTIC_POPULARITY_PRIOR_WEIGHT_LOGGED_OUT:0.15}
    popularity-prior-weight-logged-out-broad-query: ${RECOMMENDATIONS_SEMANTIC_POPULARITY_PRIOR_WEIGHT_LOGGED_OUT_BROAD_QUERY:0.25}
    popularity-prior-guardrail-threshold: ${RECOMMENDATIONS_SEMANTIC_POPULARITY_GUARDRAIL_THRESHOLD:0.45}
    popularity-prior-guardrail-max-weight: ${RECOMMENDATIONS_SEMANTIC_POPULARITY_GUARDRAIL_MAX_WEIGHT:0.05}
    popularity-prior-normalization-power: ${RECOMMENDATIONS_SEMANTIC_POPULARITY_NORMALIZATION_POWER:2.0}
    broad-query-low-quality-score-threshold: ${RECOMMENDATIONS_SEMANTIC_BROAD_LOW_QUALITY_SCORE_THRESHOLD:72}
    broad-query-low-quality-popularity-threshold: ${RECOMMENDATIONS_SEMANTIC_BROAD_LOW_QUALITY_POPULARITY_THRESHOLD:15000}
    broad-query-low-quality-penalty: ${RECOMMENDATIONS_SEMANTIC_BROAD_LOW_QUALITY_PENALTY:0.88}
    # Query-first quality gate for sparse/low-signal catalog items in semantic mode.
    quality-gate-enabled: ${RECOMMENDATIONS_SEMANTIC_QUALITY_GATE_ENABLED:true}
    quality-gate-min-score: ${RECOMMENDATIONS_SEMANTIC_QUALITY_GATE_MIN_SCORE:65}
    quality-gate-min-popularity: ${RECOMMENDATIONS_SEMANTIC_QUALITY_GATE_MIN_POPULARITY:2000}
    quality-gate-high-relevance-override: ${RECOMMENDATIONS_SEMANTIC_QUALITY_GATE_HIGH_RELEVANCE_OVERRIDE:0.82}
    sparse-metadata-relevance-floor: ${RECOMMENDATIONS_SEMANTIC_SPARSE_METADATA_RELEVANCE_FLOOR:0.62}
    # Keep semantic retrieval query-first for logged-in users (personalization is mainly rerank-time).
    list-blend-cap-with-query: ${RECOMMENDATIONS_SEMANTIC_LIST_BLEND_CAP_WITH_QUERY:0.08}
    list-blend-cap-broad-query: ${RECOMMENDATIONS_SEMANTIC_LIST_BLEND_CAP_BROAD_QUERY:0.12}
    list-blend-cap-title-intent: ${RECOMMENDATIONS_SEMANTIC_LIST_BLEND_CAP_TITLE_INTENT:0.05}
    # Deterministic second-pass lexical query expansion for broad/ambiguous prompts.
    second-pass-enabled: ${RECOMMENDATIONS_SEMANTIC_SECOND_PASS_ENABLED:true}
    second-pass-context-size: ${RECOMMENDATIONS_SEMANTIC_SECOND_PASS_CONTEXT_SIZE:25}
    second-pass-max-added-tokens: ${RECOMMENDATIONS_SEMANTIC_SECOND_PASS_MAX_ADDED_TOKENS:8}
    second-pass-trigger-max-query-tokens: ${RECOMMENDATIONS_SEMANTIC_SECOND_PASS_TRIGGER_MAX_QUERY_TOKENS:5}
    second-pass-skip-top-relevance-threshold: ${RECOMMENDATIONS_SEMANTIC_SECOND_PASS_SKIP_TOP_RELEVANCE_THRESHOLD:0.80}
    # Runtime local-catalog seeding: embed missing local catalog hits on-demand (no AniList calls)
    # before semantic retrieval when candidate pools are too small.
    catalog-seeding-enabled: ${RECOMMENDATIONS_SEMANTIC_CATALOG_SEEDING_ENABLED:true}
    catalog-seeding-max-per-query: ${RECOMMENDATIONS_SEMANTIC_CATALOG_SEEDING_MAX_PER_QUERY:12}
    # Deterministic in-memory query result cache for semantic mode.
    cache-enabled: ${RECOMMENDATIONS_SEMANTIC_CACHE_ENABLED:true}
    cache-size: ${RECOMMENDATIONS_SEMANTIC_CACHE_SIZE:2000}
    cache-ttl-hours: ${RECOMMENDATIONS_SEMANTIC_CACHE_TTL_HOURS:6}
    model-fingerprint: ${RECOMMENDATIONS_SEMANTIC_MODEL_FINGERPRINT:semantic-v1}
  similar:
    # Runtime local-catalog seeding for seed-driven recommendations when candidate pools underfill.
    catalog-seeding-max-per-request: ${RECOMMENDATIONS_SIMILAR_CATALOG_SEEDING_MAX_PER_REQUEST:12}
  metadata-sync:
    # Disabled by default to avoid unexpected AniList load during local dev.
    enabled: ${RECOMMENDATIONS_METADATA_SYNC_ENABLED:false}
    initial-delay-ms: ${RECOMMENDATIONS_METADATA_SYNC_INITIAL_DELAY_MS:120000}
    # Track A: low-metadata backfill lane. Refreshes sparse/unreleased catalog IDs directly.
    low-metadata-backfill-enabled: ${RECOMMENDATIONS_METADATA_SYNC_LOW_METADATA_BACKFILL_ENABLED:true}
    low-metadata-backfill-fixed-delay-ms: ${RECOMMENDATIONS_METADATA_SYNC_LOW_METADATA_BACKFILL_FIXED_DELAY_MS:86400000}
    low-metadata-backfill-max-ids: ${RECOMMENDATIONS_METADATA_SYNC_LOW_METADATA_BACKFILL_MAX_IDS:90}
    # Single weekly full-catalog rolling refresh window (cursor-resumable).
    # Track B: incremental full-catalog scan lane with cursor wrap at end-of-catalog.
    weekly-full-catalog-enabled: ${RECOMMENDATIONS_METADATA_SYNC_WEEKLY_FULL_CATALOG_ENABLED:true}
    weekly-full-catalog-fixed-delay-ms: ${RECOMMENDATIONS_METADATA_SYNC_WEEKLY_FULL_CATALOG_FIXED_DELAY_MS:604800000}
    weekly-full-catalog-pages: ${RECOMMENDATIONS_METADATA_SYNC_WEEKLY_FULL_CATALOG_PAGES:120}
    full-catalog-wrap-on-exhausted: ${RECOMMENDATIONS_METADATA_SYNC_FULL_CATALOG_WRAP_ON_EXHAUSTED:true}
    # AniList full-catalog payload is heavier; keep page size conservative.
    full-catalog-per-page: ${RECOMMENDATIONS_METADATA_SYNC_FULL_CATALOG_PER_PAGE:10}
    # Weekly local graph rebuild from anime_catalog.metadata_json (no AniList calls).
    weekly-graph-rebuild-enabled: ${RECOMMENDATIONS_METADATA_SYNC_WEEKLY_GRAPH_REBUILD_ENABLED:true}
    weekly-graph-rebuild-fixed-delay-ms: ${RECOMMENDATIONS_METADATA_SYNC_WEEKLY_GRAPH_REBUILD_FIXED_DELAY_MS:604800000}
    # Early-stop full-catalog windows when we encounter this many consecutive pages
    # where every entry is already embedded and metadata fingerprint-unchanged.
    full-catalog-unchanged-stop-pages: ${RECOMMENDATIONS_METADATA_SYNC_FULL_CATALOG_UNCHANGED_STOP_PAGES:40}
    adaptive-budget-enabled: ${RECOMMENDATIONS_METADATA_SYNC_ADAPTIVE_BUDGET_ENABLED:true}
    adaptive-rate-limit-threshold: ${RECOMMENDATIONS_METADATA_SYNC_ADAPTIVE_RATE_LIMIT_THRESHOLD:3}
    adaptive-retry-threshold: ${RECOMMENDATIONS_METADATA_SYNC_ADAPTIVE_RETRY_THRESHOLD:5}
    # Reason-aware retry/dead-letter policy for embedding population failures.
    failure-policy:
      dead-letter-hold-ms: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_DEAD_LETTER_HOLD_MS:86400000}
      rate-limit-max-attempts: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_RATE_LIMIT_MAX_ATTEMPTS:8}
      rate-limit-initial-delay-ms: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_RATE_LIMIT_INITIAL_DELAY_MS:900000}
      rate-limit-max-delay-ms: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_RATE_LIMIT_MAX_DELAY_MS:7200000}
      rate-limit-backoff-multiplier: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_RATE_LIMIT_BACKOFF_MULTIPLIER:2.0}
      upstream-max-attempts: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_UPSTREAM_MAX_ATTEMPTS:5}
      upstream-initial-delay-ms: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_UPSTREAM_INITIAL_DELAY_MS:300000}
      upstream-max-delay-ms: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_UPSTREAM_MAX_DELAY_MS:3600000}
      upstream-backoff-multiplier: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_UPSTREAM_BACKOFF_MULTIPLIER:2.0}
      network-max-attempts: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_NETWORK_MAX_ATTEMPTS:5}
      network-initial-delay-ms: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_NETWORK_INITIAL_DELAY_MS:300000}
      network-max-delay-ms: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_NETWORK_MAX_DELAY_MS:3600000}
      network-backoff-multiplier: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_NETWORK_BACKOFF_MULTIPLIER:2.0}
      embed-max-attempts: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_EMBED_MAX_ATTEMPTS:3}
      embed-initial-delay-ms: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_EMBED_INITIAL_DELAY_MS:120000}
      embed-max-delay-ms: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_EMBED_MAX_DELAY_MS:900000}
      embed-backoff-multiplier: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_EMBED_BACKOFF_MULTIPLIER:2.0}
      unknown-max-attempts: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_UNKNOWN_MAX_ATTEMPTS:4}
      unknown-initial-delay-ms: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_UNKNOWN_INITIAL_DELAY_MS:300000}
      unknown-max-delay-ms: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_UNKNOWN_MAX_DELAY_MS:1800000}
      unknown-backoff-multiplier: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_UNKNOWN_BACKOFF_MULTIPLIER:2.0}
      missing-metadata-max-attempts: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_MISSING_METADATA_MAX_ATTEMPTS:1}
      validation-max-attempts: ${RECOMMENDATIONS_METADATA_FAILURE_POLICY_VALIDATION_MAX_ATTEMPTS:1}
  explanations:
    # Phase 8: add optional CF contributor hint in the one-sentence reason.
    cf-contributors-enabled: ${RECOMMENDATIONS_CF_CONTRIBUTORS_ENABLED:false}
    # Optional hosted/local LLM explanation rewrite. Falls back to deterministic reasons on error.
    llm-enabled: ${RECOMMENDATIONS_EXPLANATIONS_LLM_ENABLED:false}
    # provider: deterministic | openai | ollama
    provider: ${RECOMMENDATIONS_EXPLANATIONS_PROVIDER:openai}
    openai-api-key: ${RECOMMENDATIONS_EXPLANATIONS_OPENAI_API_KEY:}
    openai-base-url: ${RECOMMENDATIONS_EXPLANATIONS_OPENAI_BASE_URL:https://api.openai.com/v1}
    openai-model: ${RECOMMENDATIONS_EXPLANATIONS_OPENAI_MODEL:gpt-4o-mini}
    openai-timeout-ms: ${RECOMMENDATIONS_EXPLANATIONS_OPENAI_TIMEOUT_MS:2500}
    ollama-base-url: ${RECOMMENDATIONS_EXPLANATIONS_OLLAMA_BASE_URL:}
    ollama-model: ${RECOMMENDATIONS_EXPLANATIONS_OLLAMA_MODEL:llama3.2:3b}
    ollama-timeout-ms: ${RECOMMENDATIONS_EXPLANATIONS_OLLAMA_TIMEOUT_MS:2500}
    # Number of LLM-generated explanation sentences cached in-memory (LRU).
    llm-cache-size: ${RECOMMENDATIONS_EXPLANATIONS_LLM_CACHE_SIZE:2000}
    # Max LLM rewrites per response. Set <=0 for unlimited (higher cost).
    llm-max-rewrites-per-request: ${RECOMMENDATIONS_EXPLANATIONS_LLM_MAX_REWRITES_PER_REQUEST:10}
